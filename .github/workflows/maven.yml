name: Java CI/CD Pipeline to Tomcat

on:
  push:
    branches: [ main ]

jobs:

  # JOB 1: BUILD + SONARQUBE ANALYSIS
  build:
    runs-on: [self-hosted, linux]

    steps:

      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Install Maven
      - name: Install Maven
        run: |
          if ! command -v mvn &> /dev/null; then
            sudo dnf install -y maven
          fi
          mvn -version

      # 4. Build WAR
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 5. SonarQube Analysis
      - name: SonarQube Analysis
        env:
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=hotstar \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.token="$SONAR_TOKEN"

      # 6. Upload WAR artifact
      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war
          if-no-files-found: error

  # JOB 2: DEPLOY TO TOMCAT
  deploy:
    runs-on: [self-hosted, linux]
    needs: build

    steps:

      # 7. Download WAR
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: myapp
          path: ./artifact

      # 8. Deploy to Tomcat EC2
      - name: Deploy to Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          WAR_FILE=$(find ./artifact -name "*.war" | head -n 1)

          if [ -z "$WAR_FILE" ]; then
            echo "WAR file not found!"
            exit 1
          fi

          echo "Deploying $WAR_FILE to Tomcat..."

          curl --fail-with-body --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            --upload-file "$WAR_FILE" \
            "http://$TOMCAT_HOST/manager/text/deploy?path=/myapp&update=true"

      # 9. Verify Deployment
      - name: Verify Deployment
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          curl --fail --show-error \
            "http://$TOMCAT_HOST/myapp/"

          echo "Deployment successful!"
